name: Temporary Entrepreneurs First WordPress API probe 2026-07-26

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run WordPress API probe
        run: python scripts/tmp_joinef_api_probe_20260726.py
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joinef-api-probe-rerun-20260726
          path: artifact
          if-no-files-found: warn
          retention-days: 30
