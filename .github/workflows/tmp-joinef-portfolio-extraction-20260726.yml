name: Temporary Entrepreneurs First portfolio extraction 2026-07-26

on:
  push:
    branches:
      - tmp-joinef-portfolio-extraction-20260726
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run company API probe
        run: python scripts/tmp_joinef_api_probe_20260726.py
      - name: Upload extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joinef-portfolio-api-probe-20260726
          path: artifact
          if-no-files-found: warn
          retention-days: 30
