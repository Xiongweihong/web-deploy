name: Temporary Entrepreneurs First portfolio extraction 2026-07-26

on:
  push:
    branches:
      - tmp-joinef-portfolio-extraction-20260726
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  crosscheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-check dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run EF Getro cross-check
        run: python scripts/tmp_joinef_getro_crosscheck_20260726.py
      - name: Upload cross-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joinef-getro-crosscheck-20260726
          path: artifact
          if-no-files-found: warn
          retention-days: 30
