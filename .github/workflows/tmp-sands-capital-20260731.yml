name: Temporary Sands Capital discovery 2026-07-31

on:
  push:
    branches:
      - tmp-sands-capital-20260731
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run discovery
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/tmp_sands_capital_discovery_20260731.py 2>&1 | tee /tmp/sands-discovery.log
          code=${PIPESTATUS[0]}
          mkdir -p artifact
          cp /tmp/sands-discovery.log artifact/execution.log
          exit ${code}
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sands-capital-discovery-20260731
          path: artifact
          if-no-files-found: warn
          retention-days: 30
