name: Temporary Index transport test 2026-07-31

on:
  push:
    branches:
      - tmp-multi-vc-extraction-20260731
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Test reader transport against two official Index pages
        run: python scripts/tmp_jina_index_test_20260731.py
