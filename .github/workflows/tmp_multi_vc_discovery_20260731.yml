name: Temporary multi-VC extraction 2026-07-31

on:
  push:
    branches:
      - tmp-multi-vc-extraction-20260731
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests playwright beautifulsoup4 lxml tldextract
          python -m playwright install --with-deps chromium
      - name: Run audited extraction
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p artifact
          python scripts/tmp_multi_vc_final_runner_v3_20260731.py 2>&1 | tee /tmp/multi-vc-final.log
          code=${PIPESTATUS[0]}
          cp /tmp/multi-vc-final.log artifact/execution.log
          exit ${code}
      - name: Upload extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-vc-final-extraction-20260731
          path: artifact
          if-no-files-found: warn
          retention-days: 30
