name: Temporary Fly Ventures portfolio extraction 2026-07-26

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Probe Fly Ventures portfolio
        run: python scripts/tmp_flyvc_probe_20260726.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyvc-portfolio-probe-20260726
          path: artifact
          if-no-files-found: warn
          retention-days: 30
