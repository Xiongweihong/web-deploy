name: Temporary Foundation Capital extraction 2026-07-31

on:
  push:
    branches:
      - tmp-foundation-capital-20260731
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests playwright
          python -m playwright install --with-deps chromium
      - name: Run discovery
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p artifact
          python scripts/tmp_foundation_capital_discovery_20260731.py 2>&1 | tee /tmp/foundation-discovery.log
          code=${PIPESTATUS[0]}
          cp /tmp/foundation-discovery.log artifact/execution.log
          exit ${code}
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-capital-discovery-20260731
          path: artifact
          if-no-files-found: warn
          retention-days: 30
