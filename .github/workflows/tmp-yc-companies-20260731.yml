name: Temporary Sequoia portfolio discovery 2026-07-31

on:
  push:
    branches:
      - tmp-yc-companies-6107-20260731
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Run Sequoia discovery
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/tmp_sequoia_discovery_20260731.py 2>&1 | tee /tmp/sequoia-discovery.log
          code=${PIPESTATUS[0]}
          mkdir -p artifact
          cp /tmp/sequoia-discovery.log artifact/execution.log
          exit ${code}
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequoia-portfolio-discovery-20260731
          path: artifact
          if-no-files-found: warn
          retention-days: 30
