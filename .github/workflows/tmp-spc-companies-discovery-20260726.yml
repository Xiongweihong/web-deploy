name: Temporary South Park Commons companies discovery 2026-07-26

on:
  push:
    branches:
      - tmp-spc-companies-discovery-20260726
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium
      - name: Harden client-grid expansion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp_spc_companies_full_extract_20260726.py')
          text = path.read_text(encoding='utf-8')
          old = '''            button.click()\n            page.wait_for_timeout(300)'''
          new = '''            page.evaluate(\"\"\"\n            () => {\n              const button = document.querySelector('astro-island[component-url*=\\\"CompanyGrid\\\"] button[data-see-more=\\\"true\\\"]');\n              if (!button) throw new Error('See More button not found');\n              button.click();\n            }\n            \"\"\")\n            page.wait_for_timeout(500)'''
          if old not in text:
              raise SystemExit('Expected click block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Run evidence-first full extraction
        shell: bash
        run: |
          set -o pipefail
          python scripts/tmp_spc_companies_full_extract_20260726.py 2>&1 | tee /tmp/spc-execution.log
          code=${PIPESTATUS[0]}
          mkdir -p artifact-full
          cp /tmp/spc-execution.log artifact-full/execution.log
          exit ${code}
      - name: Upload extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spc-companies-full-extraction-20260726
          path: artifact-full
          if-no-files-found: warn
          retention-days: 30
