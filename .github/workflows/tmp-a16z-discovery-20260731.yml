name: Temporary a16z discovery 2026-07-31

on:
  push:
    branches:
      - tmp-a16z-companies-20260731
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Run source discovery
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/tmp_a16z_discovery_20260731.py 2>&1 | tee /tmp/a16z-discovery.log
          code=${PIPESTATUS[0]}
          mkdir -p artifact
          cp /tmp/a16z-discovery.log artifact/execution.log
          exit ${code}
      - name: Probe jobs company API
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/tmp_a16z_jobs_probe_20260731.py 2>&1 | tee /tmp/a16z-jobs-probe.log
          code=${PIPESTATUS[0]}
          cp /tmp/a16z-jobs-probe.log artifact/jobs-probe-execution.log
          exit ${code}
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a16z-discovery-20260731
          path: artifact
          if-no-files-found: warn
          retention-days: 30
