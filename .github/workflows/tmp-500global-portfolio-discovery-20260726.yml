name: Temporary 500 Global portfolio discovery 2026-07-26

on:
  push:
    branches:
      - tmp-500global-portfolio-discovery-20260726
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install discovery dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium
      - name: Run evidence-first discovery
        run: python scripts/tmp_500global_portfolio_discovery_20260726.py
      - name: Run API double-snapshot audit
        run: python scripts/tmp_500global_api_snapshot_20260726.py
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 500global-portfolio-complete-20260726
          path: |
            artifact
            artifact-api
          if-no-files-found: warn
          retention-days: 30
