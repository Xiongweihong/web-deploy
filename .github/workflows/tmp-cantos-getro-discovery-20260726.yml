name: Temporary Cantos Getro extraction 2026-07-26

on:
  push:
    branches:
      - tmp-cantos-jobs-extraction-20260726
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Patch browser-aligned request contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp_cantos_full_extract_20260726.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace('"Accept": "application/json, text/plain, */*",', '"Accept": "application/json",')
          text = text.replace('    "Origin": "https://jobs.cantos.vc",\n', '')
          text = text.replace('jobs = fetch_collection(session, snapshot, "jobs", page_size=100)', 'jobs = fetch_collection(session, snapshot, "jobs", page_size=20)')
          text = text.replace('companies = fetch_collection(session, snapshot, "companies", page_size=100)', 'companies = fetch_collection(session, snapshot, "companies", page_size=12)')

          old = '''    counts_response = get_json(session, COUNTS_ENDPOINT)
              counts_raw = counts_response.content
              save_bytes(RAW / f"snapshot-{snapshot:02d}" / "network-counts.json", counts_raw, {
                  "endpoint": COUNTS_ENDPOINT,
                  "method": "GET",
                  "status": counts_response.status_code,
                  "content_type": counts_response.headers.get("content-type"),
                  "date": counts_response.headers.get("date"),
                  "etag": counts_response.headers.get("etag"),
                  "fetched_at_epoch": time.time(),
              })
              network_counts = (counts_response.json().get("results") or {})'''.replace('          ', '')
          new = '''    network_counts = {}
              try:
                  counts_response = get_json(session, COUNTS_ENDPOINT, attempts=1)
                  counts_raw = counts_response.content
                  save_bytes(RAW / f"snapshot-{snapshot:02d}" / "network-counts.json", counts_raw, {
                      "endpoint": COUNTS_ENDPOINT,
                      "method": "GET",
                      "status": counts_response.status_code,
                      "content_type": counts_response.headers.get("content-type"),
                      "date": counts_response.headers.get("date"),
                      "etag": counts_response.headers.get("etag"),
                      "fetched_at_epoch": time.time(),
                  })
                  network_counts = (counts_response.json().get("results") or {})
              except Exception as exc:
                  write_json(RAW / f"snapshot-{snapshot:02d}" / "network-counts-error.json", {"error": repr(exc)})'''.replace('          ', '')
          if old not in text:
              raise SystemExit('Expected network-count block was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Run evidence-first full extraction
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/tmp_cantos_full_extract_20260726.py 2>&1 | tee /tmp/cantos-execution.log
          code=${PIPESTATUS[0]}
          mkdir -p artifact-full
          cp /tmp/cantos-execution.log artifact-full/execution.log
          exit ${code}
      - name: Upload extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cantos-full-extraction-20260726
          path: artifact-full
          if-no-files-found: warn
          retention-days: 30
