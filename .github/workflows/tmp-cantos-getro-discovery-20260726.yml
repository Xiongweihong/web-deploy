name: Temporary Cantos Getro extraction 2026-07-26

on:
  push:
    branches:
      - tmp-cantos-jobs-extraction-20260726
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run evidence-first full extraction
        run: python scripts/tmp_cantos_full_extract_20260726.py
      - name: Upload extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cantos-full-extraction-20260726
          path: artifact-full
          if-no-files-found: warn
          retention-days: 30
